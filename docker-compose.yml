services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perekup
      POSTGRES_USER: perekup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perekup_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perekup -d perekup"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: perekupbot:latest
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    image: perekupbot:latest
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
  worker:
    image: perekupbot:latest
    command: python -m app.workers.main
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
volumes:
  postgres_data:
